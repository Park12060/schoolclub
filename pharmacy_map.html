<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대전광역시 약국 찾기 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:#0f1117;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ── Header ── */
  header{
    background:linear-gradient(135deg,#1a1f2e 0%,#16213e 50%,#0d1b2a 100%);
    border-bottom:1px solid rgba(99,179,237,0.2);
    padding:12px 20px;
    display:flex;align-items:center;gap:16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);
    z-index:1000;flex-shrink:0
  }
  .logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,#63b3ed,#9f7aea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
  .logo span{font-size:13px;display:block;font-weight:400;color:#718096;-webkit-text-fill-color:#718096}
  .search-wrap{flex:1;position:relative;max-width:360px}
  .search-wrap input{
    width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(99,179,237,0.3);
    border-radius:24px;padding:9px 16px 9px 38px;color:#e2e8f0;font-size:14px;font-family:inherit;
    outline:none;transition:all .2s
  }
  .search-wrap input:focus{border-color:#63b3ed;background:rgba(99,179,237,0.1);box-shadow:0 0 0 3px rgba(99,179,237,0.15)}
  .search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
  .district-filters{display:flex;gap:6px;flex-wrap:wrap}
  .filter-btn{
    padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06);color:#a0aec0;cursor:pointer;font-size:12px;
    font-family:inherit;transition:all .2s;white-space:nowrap
  }
  .filter-btn:hover{background:rgba(255,255,255,0.12);color:#e2e8f0}
  .filter-btn.active{border-color:transparent;color:#fff;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
  .filter-btn[data-g="all"].active{background:linear-gradient(135deg,#667eea,#764ba2)}
  .filter-btn[data-g="sg"].active{background:linear-gradient(135deg,#f093fb,#f5576c)}
  .filter-btn[data-g="dk"].active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
  .filter-btn[data-g="dd"].active{background:linear-gradient(135deg,#43e97b,#38f9d7)}
  .filter-btn[data-g="ys"].active{background:linear-gradient(135deg,#fa709a,#fee140)}
  .filter-btn[data-g="jg"].active{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}

  /* ── Body ── */
  .body{display:flex;flex:1;overflow:hidden}
  #map{flex:1;z-index:1}

  /* ── Sidebar ── */
  #sidebar{
    width:320px;background:#1a1f2e;border-left:1px solid rgba(99,179,237,0.15);
    display:flex;flex-direction:column;overflow:hidden;flex-shrink:0
  }
  .sidebar-header{padding:16px;border-bottom:1px solid rgba(255,255,255,0.08);font-weight:500;font-size:13px;color:#718096}
  .sidebar-count{color:#63b3ed;font-weight:700;font-size:16px}
  #pharmacy-list{flex:1;overflow-y:auto;padding:8px}
  #pharmacy-list::-webkit-scrollbar{width:4px}
  #pharmacy-list::-webkit-scrollbar-track{background:transparent}
  #pharmacy-list::-webkit-scrollbar-thumb{background:rgba(99,179,237,0.3);border-radius:2px}
  .pharm-item{
    padding:12px;margin-bottom:6px;border-radius:10px;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);
    cursor:pointer;transition:all .2s
  }
  .pharm-item:hover{background:rgba(99,179,237,0.1);border-color:rgba(99,179,237,0.3);transform:translateX(2px)}
  .pharm-item.selected{background:rgba(99,179,237,0.15);border-color:#63b3ed}
  .pharm-name{font-weight:600;font-size:14px;margin-bottom:4px}
  .pharm-addr{font-size:11px;color:#718096;line-height:1.4;margin-bottom:4px}
  .pharm-phone{font-size:12px;color:#9f7aea}
  .pharm-badge{
    display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;
    font-weight:600;margin-bottom:6px
  }
  .badge-sg{background:rgba(245,87,108,0.2);color:#f5576c}
  .badge-dk{background:rgba(0,242,254,0.15);color:#4facfe}
  .badge-dd{background:rgba(56,249,215,0.15);color:#43e97b}
  .badge-ys{background:rgba(254,225,64,0.15);color:#fee140}
  .badge-jg{background:rgba(251,194,235,0.15);color:#fbc2eb}

  /* ── Progress Toast (우측 하단 알림창) ── */
  #progress-toast{
    position:fixed;right:20px;bottom:20px;background:rgba(26,31,46,0.95);
    border:1px solid rgba(99,179,237,0.3);border-radius:12px;padding:16px;
    width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:9999;
    backdrop-filter:blur(8px);transition:all .3s;
  }
  .progress-title{font-size:14px;font-weight:700;color:#63b3ed;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
  .progress-sub{font-size:11px;color:#a0aec0;margin-bottom:10px;line-height:1.4}
  .progress-bar-wrap{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-bottom:8px}
  .progress-bar{height:100%;background:linear-gradient(90deg,#63b3ed,#9f7aea);border-radius:3px;transition:width .3s;width:0%}
  .progress-text{font-size:11px;color:#cbd5e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress-cur{color:#63b3ed;font-weight:700}
  #skip-btn{
    padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);color:#a0aec0;cursor:pointer;font-size:10px;
    transition:all .2s;
  }
  #skip-btn:hover{background:rgba(255,255,255,0.15);color:#fff}

  /* ── Info popup in map ── */
  .leaflet-popup-content-wrapper{background:#1a1f2e;border:1px solid rgba(99,179,237,0.3);color:#e2e8f0;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
  .leaflet-popup-tip{background:#1a1f2e}
  .popup-name{font-weight:700;font-size:15px;margin-bottom:6px}
  .popup-addr{font-size:12px;color:#718096;line-height:1.5;margin-bottom:4px}
  .popup-phone{font-size:13px;color:#9f7aea}

  /* ── Stats bar ── */
  .stats-bar{display:flex;gap:20px;padding:0 20px}
  .stat{text-align:center}
  .stat-num{font-size:16px;font-weight:700;color:#63b3ed}
  .stat-lbl{font-size:10px;color:#718096}
</style>
</head>
<body>

<header>
  <div class="logo">💊 대전 약국 지도<span>Daejeon Pharmacy Map</span></div>
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="약국명 또는 주소 검색..."></div>
  <div class="district-filters">
    <button class="filter-btn active" data-g="all">전체</button>
    <button class="filter-btn" data-g="sg">서구</button>
    <button class="filter-btn" data-g="dk">동구</button>
    <button class="filter-btn" data-g="dd">대덕구</button>
    <button class="filter-btn" data-g="ys">유성구</button>
    <button class="filter-btn" data-g="jg">중구</button>
  </div>
  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="stat-total">-</div><div class="stat-lbl">전체</div></div>
    <div class="stat"><div class="stat-num" id="stat-geocoded">-</div><div class="stat-lbl">지도표시</div></div>
  </div>
</header>

<div class="body">
  <div id="map"></div>
  <div id="sidebar">
    <div class="sidebar-header">약국 목록 <span class="sidebar-count" id="list-count">0</span>개</div>
    <div id="pharmacy-list"></div>
  </div>
</div>

<div id="progress-toast">
  <div class="progress-title">
    <span>🗺️ 백그라운드 좌표 탐색 중...</span>
    <button id="skip-btn">숨기기</button>
  </div>
  <div class="progress-sub">기본 중심 좌표로 약국을 선배치했습니다.<br>정밀 좌표는 백그라운드에서 자동 적재됩니다.</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>
  <div class="progress-text"><span class="progress-cur" id="pcur">0</span> / <span id="ptotal">0</span> : <span id="pcurrent-name" style="color:#a0aec0"></span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<script>
// ── CSV 파일 정의 ──────────────────────────────────────────
const CSV_FILES = [
  { file:'seoku.csv',     gu:'서구',   g:'sg', cols:{name:1, addr:2, phone:3} },
  { file:'dongku.csv',    gu:'동구',   g:'dk', cols:{name:1, addr:3, phone:2} },
  { file:'daedukku.csv',  gu:'대덕구', g:'dd', cols:{name:0, addr:1, phone:2} },
  { file:'yuseongku.csv', gu:'유성구', g:'ys', cols:{name:2, addr:3, phone:4} },
  { file:'jungku.csv',    gu:'중구',   g:'jg', cols:{name:1, addr:4, phone:2} }
];

const DIST_NAMES = { sg:'서구', dk:'동구', dd:'대덕구', ys:'유성구', jg:'중구' };
const CACHE_KEY = 'dj_pharmacy_geocache_v2';

// ── 구별 기본 중심 좌표 (Fallback 좌표 생성용) ──────────────
const FALLBACK_COORDS = {
  'sg': [36.3554, 127.3838], // 서구청 인근 / 둔산동
  'dk': [36.3315, 127.4545], // 동구청 인근
  'dd': [36.3466, 127.4157], // 대덕구청 인근
  'ys': [36.3622, 127.3563], // 유성구청 인근
  'jg': [36.3256, 127.4209]  // 중구청 인근
};

// ── Leaflet 맵 초기화 ──────────────────────────────────────
const map = L.map('map', {zoomControl:false}).setView([36.3504, 127.3845], 12);
L.control.zoom({position:'bottomright'}).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 55,
  iconCreateFunction: function(cluster) {
    const cnt = cluster.getChildCount();
    const size = cnt < 10 ? 36 : cnt < 50 ? 44 : 52;
    return L.divIcon({
      html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:${cnt<100?13:11}px;box-shadow:0 2px 12px rgba(102,126,234,0.5)">${cnt}</div>`,
      className:'', iconSize:[size,size]
    });
  }
});
map.addLayer(clusterGroup);

// ── 상태 ──────────────────────────────────────────────────
let allPharmacies = [];    // {gu, g, name, addr, phone, lat, lng, isGeocoded, baseLat, baseLng}
let filteredData  = [];
let currentFilter = 'all';
let searchTerm    = '';
let geocacheStore = {};
let markerMap     = {};    // idx → marker
let hideProgress  = false;

// ── 색상 ──────────────────────────────────────────────────
function getColor(g) {
  const m={sg:'#f5576c',dk:'#4facfe',dd:'#43e97b',ys:'#fee140',jg:'#e879f9'};
  return m[g]||'#63b3ed';
}
function makeIcon(g, isPrecise=true) {
  const c = getColor(g);
  // 정밀 지오코딩이 아닌 Fallback 마커는 약간 투명도를 주어 구분이 가능하게 함
  const opacity = isPrecise ? '1' : '0.6';
  const s = 28;
  return L.divIcon({
    html:`<div style="width:${s}px;height:${s}px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c};opacity:${opacity};border:2px solid rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(0,0,0,0.4)"><div style="transform:rotate(45deg);text-align:center;line-height:${s-4}px;font-size:12px">💊</div></div>`,
    className:'', iconSize:[s,s], iconAnchor:[s/2,s]
  });
}

// ── CSV 로드 ──────────────────────────────────────────────
async function loadAllCSV() {
  const raw = [];
  for (const def of CSV_FILES) {
    try {
      const resp = await fetch(def.file);
      const text = await resp.text();
      const res  = Papa.parse(text, {skipEmptyLines:true});
      const rows = res.data.slice(1);
      
      const baseCoord = FALLBACK_COORDS[def.g];
      for (const row of rows) {
        const name  = (row[def.cols.name]  || '').trim();
        const addr  = (row[def.cols.addr]  || '').trim();
        const phone = (row[def.cols.phone] || '').trim();
        if (addr.length > 5) {
          // 구청 좌표를 중심으로 0.03도(약 2~3km) 반경 내에 무작위 분산(Jitter)시켜 겹치지 않게 초기화
          const jitterLat = baseCoord[0] + (Math.random() - 0.5) * 0.05;
          const jitterLng = baseCoord[1] + (Math.random() - 0.5) * 0.05;
          raw.push({
            gu:def.gu, g:def.g, name, addr, phone,
            lat: jitterLat, lng: jitterLng,
            isGeocoded: false
          });
        }
      }
    } catch(e) {
      console.warn('CSV load fail:', def.file, e);
    }
  }
  return raw;
}

// ── 지오코딩 ──────────────────────────────────────────────
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)||'{}'); } catch(e){ return {}; }
}
function saveCache(cache) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e){}
}

async function geocodeAddress(addr, cache) {
  if (cache[addr] !== undefined) return cache[addr];
  // allOrigins 프록시를 통해 OpenStreetMap 지오코딩 요청 (CORS 이슈 해소)
  const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=${encodeURIComponent(addr)}`;
  const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(nominatimUrl)}`;
  try {
    const r = await fetch(proxyUrl);
    const d = await r.json();
    if (d && d.length > 0) {
      const result = {lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon)};
      cache[addr] = result;
      return result;
    }
  } catch(e){}
  cache[addr] = null;
  return null;
}

// ── 맵 마커 렌더링 ────────────────────────────────────────
function renderMarkers(data) {
  clusterGroup.clearLayers();
  markerMap = {};

  for (let i = 0; i < data.length; i++) {
    const p = data[i];
    const origIdx = allPharmacies.indexOf(p);
    const m = L.marker([p.lat, p.lng], {icon: makeIcon(p.g, p.isGeocoded)});
    const statusText = p.isGeocoded ? '정밀 위치 매핑 완료' : '구별 중심가 추정 위치 (탐색 대기)';
    m.bindPopup(`
      <div class="popup-name">💊 ${p.name}</div>
      <div class="popup-addr">📍 ${p.addr}</div>
      <div class="popup-phone">📞 ${p.phone||'-'}</div>
      <div style="font-size:10px;color:#a0aec0;margin-top:6px;border-top:1px solid rgba(255,255,255,0.1);padding-top:4px">💡 ${statusText}</div>
    `, {maxWidth:260});
    m.on('click', ()=>{ selectPharmacy(origIdx, false); });
    clusterGroup.addLayer(m);
    markerMap[origIdx] = m;
  }
}

// ── 사이드바 목록 ─────────────────────────────────────────
function renderList(data) {
  const list = document.getElementById('pharmacy-list');
  document.getElementById('list-count').textContent = data.length;
  list.innerHTML = '';
  for (let i = 0; i < data.length; i++) {
    const p = data[i];
    const origIdx = allPharmacies.indexOf(p);
    const el = document.createElement('div');
    el.className = 'pharm-item';
    el.dataset.idx = origIdx;
    el.innerHTML = `
      <span class="pharm-badge badge-${p.g}">${p.gu}</span>
      <div class="pharm-name">${p.name}</div>
      <div class="pharm-addr">📍 ${p.addr}</div>
      <div class="pharm-phone">📞 ${p.phone||'-'}</div>
    `;
    el.addEventListener('click', ()=>{ selectPharmacy(origIdx, true); });
    list.appendChild(el);
  }
}

function selectPharmacy(idx, flyTo) {
  document.querySelectorAll('.pharm-item.selected').forEach(el=>el.classList.remove('selected'));
  const el = document.querySelector(`.pharm-item[data-idx="${idx}"]`);
  if (el) { el.classList.add('selected'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }

  const p = allPharmacies[idx];
  if (!p) return;
  if (flyTo) {
    map.flyTo([p.lat, p.lng], p.isGeocoded ? 17 : 14, {duration:1});
  }
  if (markerMap[idx]) {
    markerMap[idx].openPopup();
  }
}

// ── 필터 & 검색 ───────────────────────────────────────────
function applyFilter() {
  filteredData = allPharmacies.filter(p => {
    const matchG = currentFilter === 'all' || p.g === currentFilter;
    const matchS = !searchTerm || p.name.includes(searchTerm) || p.addr.includes(searchTerm);
    return matchG && matchS;
  });
  renderMarkers(filteredData);
  renderList(filteredData);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.g;
    applyFilter();
  });
});

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value.trim();
  applyFilter();
});

// ── 통계 ──────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-total').textContent = allPharmacies.length;
  document.getElementById('stat-geocoded').textContent = allPharmacies.filter(p=>p.isGeocoded).length;
}

// ── 메인 실행 ─────────────────────────────────────────────
document.getElementById('skip-btn').addEventListener('click', ()=>{
  hideProgress = true;
  document.getElementById('progress-toast').style.display = 'none';
});

async function main() {
  const toast   = document.getElementById('progress-toast');
  const pbar    = document.getElementById('pbar');
  const pcur    = document.getElementById('pcur');
  const ptotal  = document.getElementById('ptotal');
  const pname   = document.getElementById('pcurrent-name');

  // 1. CSV 로드
  pname.textContent = 'CSV 파일 적재 중...';
  allPharmacies = await loadAllCSV();
  ptotal.textContent = allPharmacies.length;
  document.getElementById('stat-total').textContent = allPharmacies.length;

  // 2. 로컬스토리지 캐시 검사 및 결합
  geocacheStore = loadCache();
  for (const p of allPharmacies) {
    if (geocacheStore[p.addr]) {
      p.lat = geocacheStore[p.addr].lat;
      p.lng = geocacheStore[p.addr].lng;
      p.isGeocoded = true;
    }
  }

  // 3. 즉시 전체 렌더링 (지오코딩 안 된 약국도 추정 위치로 시각화 완료됨)
  applyFilter();
  updateStats();

  // 4. 지오코딩 미완료 대상만 백그라운드 천천히 적재
  const todo = allPharmacies.filter(p => !p.isGeocoded);
  ptotal.textContent = todo.length;
  pcur.textContent = 0;

  if (todo.length === 0) {
    toast.style.display = 'none';
    return;
  }

  let done = 0;
  for (const p of todo) {
    if (hideProgress) break;
    pname.textContent = p.name;
    pcur.textContent = ++done;
    pbar.style.width = (done / todo.length * 100) + '%';

    const geo = await geocodeAddress(p.addr, geocacheStore);
    if (geo) {
      p.lat = geo.lat;
      p.lng = geo.lng;
      p.isGeocoded = true;
      
      // 마커 위치 및 아이콘 실시간 갱신 (오픈된 팝업이나 클릭에 방해되지 않도록 부드럽게)
      const origIdx = allPharmacies.indexOf(p);
      if (markerMap[origIdx]) {
        markerMap[origIdx].setLatLng([p.lat, p.lng]);
        markerMap[origIdx].setIcon(makeIcon(p.g, true));
      }
    }

    // 주기적인 캐시 저장 및 통계 갱신
    if (done % 5 === 0) {
      saveCache(geocacheStore);
      updateStats();
    }
    // 2초 간격 유지 (OSM 서버 과부하 및 429 방지)
    await new Promise(r => setTimeout(r, 2000));
  }

  saveCache(geocacheStore);
  updateStats();
  toast.style.display = 'none';
}

main().catch(console.error);
</script>
</body>
</html>
